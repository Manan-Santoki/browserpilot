<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BrowserPilot debug</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  #left { display: flex; flex-direction: column; border-right: 1px solid #ddd; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  #log div { margin-bottom: 8px; word-wrap: break-word; }
  .agent { color: #111; }
  .tool { color: #777; font-size: 13px; }
  .status { color: #06c; font-size: 13px; }
  .error { color: #c00; }
  .approval { background: #fff4d6; padding: 8px; border-radius: 6px; }
  .approval button { margin-left: 6px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
  input[type="text"] { flex: 1; padding: 8px; }
  #preview { width: 100%; height: 100%; object-fit: contain; background: #111; }
  #bar { padding: 8px 12px; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #sid { color: #888; font-family: ui-monospace, monospace; font-size: 12px; }
</style>
<div id="left">
  <div id="bar">
    <button id="new">New session</button>
    <button id="stop" disabled>Stop</button>
    <label><input type="checkbox" id="livePreview" disabled /> Live preview</label>
    <span id="sid"></span>
  </div>
  <div id="log"></div>
  <form id="composer">
    <input type="text" id="msg" placeholder="Tell the robot what to do…" autocomplete="off" disabled />
    <button type="submit" disabled id="send">Send</button>
  </form>
</div>
<img id="preview" alt="browser preview" />
<script>
  let ws = null, sessionId = null, previewUrl = null;
  const log = document.getElementById("log");
  const preview = document.getElementById("preview");

  const line = (cls, text) => {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  };

  const setEnabled = (on) => {
    for (const id of ["stop", "livePreview", "msg", "send"]) {
      document.getElementById(id).disabled = !on;
    }
  };

  document.getElementById("new").onclick = async () => {
    const res = await fetch("/api/sessions", { method: "POST" });
    const body = await res.json();
    if (!res.ok) return line("error", body.error ?? "could not start a session");
    sessionId = body.id;
    document.getElementById("sid").textContent = sessionId.slice(0, 8);
    connect();
  };

  document.getElementById("stop").onclick = async () => {
    await fetch(`/api/sessions/${sessionId}/stop`, { method: "POST" });
    ws?.close();
    setEnabled(false);
  };

  document.getElementById("livePreview").onchange = (e) => {
    ws?.send(JSON.stringify({ type: "preview", enabled: e.target.checked }));
  };

  document.getElementById("composer").onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("msg");
    if (!input.value.trim()) return;
    line("agent", "you: " + input.value);
    ws.send(JSON.stringify({ type: "user_msg", text: input.value }));
    input.value = "";
  };

  function connect() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${scheme}://${location.host}/ws/${sessionId}`);
    ws.binaryType = "blob";
    ws.onopen = () => setEnabled(true);
    ws.onclose = () => { setEnabled(false); line("status", "socket closed"); };
    ws.onmessage = (event) => {
      if (event.data instanceof Blob) {
        // Release the previous frame's object URL or the tab leaks memory.
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(event.data);
        preview.src = previewUrl;
        return;
      }
      const msg = JSON.parse(event.data);
      if (msg.type === "agent_text") line("agent", msg.text);
      else if (msg.type === "tool_activity") line("tool", msg.summary);
      else if (msg.type === "session_status") line("status", "· " + msg.status);
      else if (msg.type === "error") line("error", msg.message);
      else if (msg.type === "file_ready") {
        const el = line("agent", "");
        const a = document.createElement("a");
        a.href = msg.url;
        a.textContent = "⬇ " + msg.filename;
        el.appendChild(a);
      } else if (msg.type === "approval_request") {
        const el = line("approval", msg.summary + " ");
        for (const [label, approved] of [["Approve", true], ["Deny", false]]) {
          const btn = document.createElement("button");
          btn.textContent = label;
          btn.onclick = () => {
            ws.send(JSON.stringify({ type: "approval", requestId: msg.requestId, approved }));
            el.textContent = `${msg.summary} — ${approved ? "approved" : "denied"}`;
          };
          el.appendChild(btn);
        }
      }
    };
  }
</script>
